name: Plan

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  # Required to mint the OIDC token used to assume the AWS plan role.
  id-token: write
  # Required to post/update the plan output as a PR comment.
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Re-install prod-only to match what the zip would actually contain on
      # apply — devDependencies would otherwise show up as spurious drift.
      - name: Prune to production dependencies
        run: pnpm install --prod --frozen-lockfile

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.6"

      # Read-only role — even a PR that edits this workflow to run `apply`
      # can't use it to change anything, since pull_request runs the
      # workflow file as committed in the PR, not the one on main.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::699799608914:role/coffee-dictionary-github-actions-plan
          aws-region: ap-southeast-2

      - name: Terraform init
        working-directory: terraform
        run: tofu init -input=false

      - name: Terraform plan
        id: plan
        working-directory: terraform
        run: |
          set -o pipefail
          tofu plan -input=false -no-color -lock-timeout=60s 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('terraform/plan_output.txt', 'utf8').slice(-60000);
            const marker = '<!-- tofu-plan -->';
            const body = `${marker}\n#### OpenTofu Plan\n<details><summary>Show plan</summary>\n\n\`\`\`\n${output}\n\`\`\`\n</details>`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
